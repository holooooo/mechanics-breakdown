<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#c{display:block}
.badge{position:absolute;left:4%;top:3.4%;display:flex;align-items:center;gap:14px;font-family:"PingFang SC";color:#fff}
.badge img{width:72px;height:72px;border-radius:50%;background:#fff;border:4px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.badge b{display:block;font-size:28px;font-weight:900;text-shadow:0 2px 10px #000}
.badge span{display:block;font-size:18px;letter-spacing:4px;color:#ffd98a;text-shadow:0 2px 8px #000}
</style></head>
<body><canvas id="c"></canvas>
<div class="badge"><img src="../brand/avatar.png"><div><b>粑粑柑（梭哈ai版）</b><span>机制拆解 · 04</span></div></div>
<script type="module">
import { drawNumber, drawBackdrop } from '../src/arena.js';
const q = new URLSearchParams(location.search), W = +q.get('w') || 1440, H = +q.get('h') || 1080, tall = H > W;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
await document.fonts.ready;
drawBackdrop(ctx, { x: 0, y: 0, w: W, h: H, t: 2, hue: 'warm' });
// radial burst
const cx = W / 2, cy = H * (tall ? 0.46 : 0.5);
ctx.save(); ctx.globalCompositeOperation = 'lighter';
for (let i = 0; i < 36; i++) { const a = i / 36 * Math.PI * 2; ctx.fillStyle = i % 2 ? 'rgba(255,170,60,0.10)' : 'rgba(255,90,30,0.06)'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, Math.max(W, H), a, a + Math.PI / 36); ctx.fill(); }
const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.6); rg.addColorStop(0, 'rgba(255,190,90,0.55)'); rg.addColorStop(1, 'rgba(255,120,40,0)'); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
ctx.restore();
// slot machine body
const mw = tall ? W * 0.8 : W * 0.6, mh = tall ? H * 0.3 : H * 0.4, mx = cx - mw / 2, my = cy - mh * 0.62;
const body = ctx.createLinearGradient(0, my, 0, my + mh); body.addColorStop(0, '#d61f3c'); body.addColorStop(1, '#7a0a1c');
ctx.fillStyle = body; ctx.strokeStyle = '#ffd36b'; ctx.lineWidth = 10; ctx.beginPath(); ctx.roundRect(mx, my, mw, mh, 40); ctx.fill(); ctx.stroke();
// bulbs
for (let i = 0; i < 22; i++) { const k = i / 21; ctx.fillStyle = i % 2 ? '#fff6c0' : '#ffb21a'; ctx.shadowColor = '#ffcf5a'; ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(mx + 30 + k * (mw - 60), my + 22, 8, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(mx + 30 + k * (mw - 60), my + mh - 22, 8, 0, Math.PI * 2); ctx.fill(); }
ctx.shadowBlur = 0;
// reels
const rw = (mw - 120) / 3, rh = mh - 110, ry = my + 55;
const reels = [['9,999', 'phys'], ['暴击', 'crit'], ['999亿', 'crit']];
reels.forEach(([txt], i) => {
  const rx = mx + 40 + i * (rw + 20);
  const g = ctx.createLinearGradient(0, ry, 0, ry + rh); g.addColorStop(0, '#d9d2c2'); g.addColorStop(0.5, '#fffaf0'); g.addColorStop(1, '#cfc6b2');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 18); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(rx, ry, rw, 18); ctx.fillRect(rx, ry + rh - 18, rw, 18);
});
const s = rh * 0.78;
['ice', 'crit', 'crit'].forEach((el, i) => drawNumber(ctx, { text: '7', x: mx + 40 + rw * (i + 0.5) + i * 20, y: ry + rh / 2 + s * 0.04, scale: 1, alpha: 1, rot: [-0.05, 0.04, -0.03][i], outline: true, glow: i ? 1 : 0.3, label: i === 1 ? '暴击' : null, size: s, L: 4, el, crit: i > 0 }));
// lever
ctx.strokeStyle = '#c9ccd2'; ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(mx + mw + 10, cy - mh * 0.1); ctx.lineTo(mx + mw + 50, my - 40); ctx.stroke();
ctx.fillStyle = '#ff2d2d'; ctx.beginPath(); ctx.arc(mx + mw + 50, my - 52, 30, 0, Math.PI * 2); ctx.fill();
// flying numbers around
const fly = tall ? [['1,222,485', 0.27, 0.115, -0.12, 'crit', 0.075], ['82亿', 0.8, 0.125, 0.14, 'crit', 0.085], ['naneinf', 0.2, 0.6, -0.1, 'elec', 0.06], ['+999', 0.85, 0.6, 0.1, 'fire', 0.06]]
  : [['1,222,485', 0.16, 0.3, -0.18, 'crit', 0.075], ['82亿', 0.88, 0.3, 0.16, 'crit', 0.09], ['naneinf', 0.12, 0.62, -0.1, 'elec', 0.055], ['+999', 0.89, 0.62, 0.1, 'fire', 0.06]];
for (const [t, fx, fy, r, el, sz] of fly) drawNumber(ctx, { text: t, x: W * fx, y: H * fy, scale: 1, alpha: 0.95, rot: r, outline: true, glow: el === 'crit' ? 1 : 0.4, label: null, size: Math.min(W, H) * sz, L: 4, el, crit: el === 'crit' });
// title
const ty = my + mh + (tall ? H * 0.11 : H * 0.12);
ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
const ts = tall ? W * 0.15 : W * 0.105;
ctx.font = `900 ${ts}px "PingFang SC"`; ctx.lineJoin = 'round'; ctx.lineWidth = ts * 0.16; ctx.strokeStyle = '#1a0500'; ctx.strokeText('跳字老虎机', cx, ty);
const tg = ctx.createLinearGradient(0, ty - ts / 2, 0, ty + ts / 2); tg.addColorStop(0, '#fff7c0'); tg.addColorStop(0.55, '#ffc21a'); tg.addColorStop(1, '#ff6a1a');
ctx.shadowColor = '#ff5a1a'; ctx.shadowBlur = 40; ctx.fillStyle = tg; ctx.fillText('跳字老虎机', cx, ty); ctx.shadowBlur = 0;
const ss = ts * 0.3; ctx.font = `800 ${ss}px "PingFang SC"`;
const sub = '游戏怎么用数字让你上瘾'; const sw = ctx.measureText(sub).width + ss * 1.2, sy = ty + ts * 0.78;
ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.beginPath(); ctx.roundRect(cx - sw / 2, sy - ss * 0.75, sw, ss * 1.5, ss * 0.4); ctx.fill();
ctx.fillStyle = '#fff'; ctx.fillText(sub, cx, sy);
// top tag
ctx.font = `900 ${ss * 0.8}px "PingFang SC"`; const tag = '8 层设计 · 从一行白字到上瘾'; const tw = ctx.measureText(tag).width + 40;
ctx.fillStyle = '#ffc35a'; ctx.beginPath(); ctx.roundRect(cx - tw / 2, my - ss * 2.3, tw, ss * 1.2, 12); ctx.fill(); ctx.fillStyle = '#2a1600'; ctx.fillText(tag, cx, my - ss * 1.7);
</script></body></html>
