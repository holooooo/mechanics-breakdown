<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Throwaway test page for tools/render.mjs: WebGL drawing that depends only on t.
const gl = c.getContext('webgl2', { preserveDrawingBuffer: true });
const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0,1); }`;
const fs = `#version 300 es
precision highp float; uniform float t; out vec4 o;
void main(){ vec2 uv = gl_FragCoord.xy/vec2(1920.,1080.); float w = sin(uv.x*10.+t*2.)*.5+.5;
 float d = length(uv-vec2(.5+.3*sin(t),.5+.2*cos(t*1.3)));
 o = vec4(mix(vec3(.1,.2,.5),vec3(1.,.5,.1),w)*smoothstep(.5,.0,d)+.05, 1.); }`;
const sh = (ty, s) => { const x = gl.createShader(ty); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const ut = gl.getUniformLocation(pr, 't');
const raf = () => new Promise(r => requestAnimationFrame(() => r()));
window.DURATION = 3;
window.renderFrame = async t => { gl.uniform1f(ut, t); gl.viewport(0, 0, 1920, 1080); gl.drawArrays(gl.TRIANGLES, 0, 3); await raf(); await raf(); };
window.READY = true;
</script>
